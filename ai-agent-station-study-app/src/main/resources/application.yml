spring:
  config:
    name: ai-agent-station-study-app
  profiles:
    active: dev
  ai:
    agent:
      chat:
        default-role-id: 85374287
  # 通用文件上传配置：为所有环境提供默认的上传大小限制，可在具体环境覆盖
  servlet:
    multipart:
      enabled: true        # 启用文件上传
      max-file-size: 200MB # 默认单文件上限
      max-request-size: 300MB # 默认请求总大小上限

autobots:
  autoagent:
    # 生图工作台与图片工具统一通过该地址转发到 reactor-tool
    image_generation_url: "http://127.0.0.1:1601"
    skill:
      enabled: false
      # 默认从当前服务工作目录下的 runtime/skills 加载运行时技能
      directories:
        - ${user.dir}/runtime/skills
      react-enabled: true
      plan-solve-enabled: true
      max-read-chars: 12000
      max-list-entries: 200
      max-glob-results: 100
      max-grep-matches: 100
      default-script-timeout-seconds: 120
