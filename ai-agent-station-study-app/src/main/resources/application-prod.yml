server:
  port: 8100

# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy


# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml

spring:
  ai:
    agent:
      chat:
        default-role-id: 85374287

autobots:
  execution:
    visitor-cookie:
      secure: true
      same-site: Lax
      allowed-origins: []
  autoagent:
    skill:
      enabled: false
      # 生产环境建议挂载独立目录，默认仍保留仓库约定路径
      directories:
        - ${user.dir}/runtime/skills
      react-enabled: true
      plan-solve-enabled: true
      max-read-chars: 12000
      max-list-entries: 200
      max-glob-results: 100
      max-grep-matches: 100
      default-script-timeout-seconds: 120
