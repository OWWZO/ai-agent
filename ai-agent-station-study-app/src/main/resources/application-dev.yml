      file_tool:
        desc: '这是一个文件读写的工具，支持写文件操作upload和获取文件操作get的命令，不支持写入以 .xlsx 为后缀的格式文件。不擅长写报告的HTML和Markdown类型文件，当有这些类型的文件需要写入或保存时，优先使用其它工具。

          - 当获取了大量的内容的时候，将内容的核心数据和结果进行总结，写入到文件里保存起来。

