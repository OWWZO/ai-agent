<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #1d1d1f;
      background: #fff;
      padding: 14px;
    }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
    .header h1 { min-width: 0; font-size: 14px; font-weight: 600; flex: 1; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b30; }
    .dot.connected { background: #34c759; }
    #status { max-width: 120px; text-align: right; overflow-wrap: anywhere; font-weight: 600; }
    label { display: block; font-size: 11px; color: #6e6e73; margin: 8px 0 4px; }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #d2d2d7;
      border-radius: 8px;
      font-size: 13px;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid #007aff; outline-offset: 2px; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    button {
      flex: 1;
      padding: 8px;
      border: 0;
      border-radius: 8px;
      background: #007aff;
      color: #fff;
      cursor: pointer;
    }
    button:hover { background: #0069dc; }
    button.secondary { background: #f2f2f7; color: #1d1d1f; }
    button.secondary:hover { background: #e8e8ed; }
    button.icon-button {
      flex: 0 0 32px;
      width: 32px;
      height: 32px;
      padding: 0;
      background: transparent;
      color: #6e6e73;
      font-size: 18px;
      line-height: 1;
    }
    button.icon-button:hover { background: #f2f2f7; color: #1d1d1f; }
    .hint { min-height: 16px; margin-top: 10px; font-size: 11px; color: #6e6e73; line-height: 1.4; }
    .hint.error { color: #c62828; }
    .hint.success { color: #16803c; }
  </style>
</head>
<body>
  <div id="mainView">
    <div class="header">
      <span class="dot" id="dot"></span>
      <h1>Cute Browser</h1>
      <span id="status">未连接</span>
      <button id="settingsBtn" class="icon-button" type="button" title="设置" aria-label="设置">⚙</button>
    </div>
    <label for="code">6 位配对码</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" />
    <div class="row">
      <button id="connectBtn" type="button">连接</button>
      <button id="disconnectBtn" class="secondary" type="button">断开</button>
    </div>
    <p class="hint">通过 Cute 服务端 relay 连接。</p>
  </div>
  <div id="settingsView" hidden>
    <div class="header">
      <button id="backBtn" class="icon-button" type="button" title="返回" aria-label="返回">‹</button>
      <h1>设置</h1>
    </div>
    <label for="origin">网页 API 地址</label>
    <input id="origin" type="url" autocomplete="url" spellcheck="false" placeholder="https://example.com" />
    <div class="row">
      <button id="saveSettingsBtn" type="button">保存</button>
    </div>
    <p id="settingsStatus" class="hint" role="status" aria-live="polite"></p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
