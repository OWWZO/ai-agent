openapi: 3.1.0
info:
  title: Reactor Tool Text Embedding Proxy API
  version: 0.1.0
  description: >
    为 Java DataAgent 提供批量文本向量代理能力的内部接口。
    该接口复用 MRAG 当前的 TEXT_EMBEDDING_* 配置，不要求独立 embedding 服务。
servers:
  - url: http://127.0.0.1:1601
paths:
  /v1/tool/embedding/text:
    post:
      summary: Embed text inputs with shared embedding configuration
      operationId: postTextEmbedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingProxyRequest'
            examples:
              default:
                summary: 批量文本向量请求
                value:
                  inputs:
                    - customer_id 字段表示客户唯一标识
                    - order_status 字段表示订单当前状态
                  normalize: true
      responses:
        '200':
          description: Batch embeddings returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingProxyResponse'
              examples:
                default:
                  summary: 归一化向量返回示例
                  value:
                    vectors:
                      - [0.0123, -0.0045, 0.0912]
                      - [0.0567, 0.0088, -0.0321]
                    dimension: 1024
                    model: text-embedding-v4
        '400':
          description: Request payload is invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Shared embedding provider failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Shared embedding provider timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    EmbeddingProxyRequest:
      type: object
      additionalProperties: false
      required:
        - inputs
        - normalize
      properties:
        inputs:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: 需要批量向量化的文本列表
        normalize:
          type: boolean
          description: 是否在返回前执行 L2 归一化
          default: true
    EmbeddingProxyResponse:
      type: object
      additionalProperties: false
      required:
        - vectors
      properties:
        vectors:
          type: array
          items:
            type: array
            items:
              type: number
              format: float
          description: 与 inputs 一一对应的向量结果
        dimension:
          type: integer
          minimum: 1
          description: 向量维度
        model:
          type: string
          description: 实际使用的 embedding 模型名
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string
          description: 可直接用于排障的失败说明
