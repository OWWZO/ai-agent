services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai-agent-station}
      MYSQL_USER: ${MYSQL_USER:-cute}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./Cute-agent-app/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./Cute-agent-app/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/002-data.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -u root -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 20

  cute-sandbox:
    build:
      context: .
      dockerfile: Dockerfile
      target: cute-tool
    restart: unless-stopped
    env_file:
      - ./cute-tool/.env
    environment:
      ENV: prod
      CUTE_TOOL_ROLE: sandbox
      CUTE_TOOL_HOST: 0.0.0.0
      CUTE_TOOL_PORT: 1602
      CUTE_TOOL_WORKERS: 1
      FILE_SAVE_PATH: /data/skilloutput
      FILE_SERVER_URL: ${PUBLIC_TOOL_URL:-http://localhost:3000/tool}/v1/file_tool
      FILE_SERVER_INTERNAL_URL: http://cute-tool:1601/v1/file_tool
      SQLITE_DB_PATH: /data/autobots.db
      SQLITE_PATH: /data/mrag_sqlite.db
      LOG_PATH: /data/logs/cute-sandbox.log
      E2B_FULL_PAUSE_DEBOUNCE_SEC: ${E2B_FULL_PAUSE_DEBOUNCE_SEC:-3}
      E2B_FS_ONLY_IDLE_SEC: ${E2B_FS_ONLY_IDLE_SEC:-1200}
      E2B_USER_OPERATING_HOLD_SEC: ${E2B_USER_OPERATING_HOLD_SEC:-600}
    volumes:
      - cute-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:1602/docs', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

  cute-tool:
    build:
      context: .
      dockerfile: Dockerfile
      target: cute-tool
    restart: unless-stopped
    env_file:
      - ./cute-tool/.env
    environment:
      ENV: prod
      CUTE_TOOL_ROLE: api
      CUTE_TOOL_HOST: 0.0.0.0
      CUTE_TOOL_PORT: 1601
      CUTE_TOOL_WORKERS: ${TOOL_WORKERS:-3}
      CUTE_SANDBOX_URL: http://cute-sandbox:1602
      FILE_SAVE_PATH: /data/skilloutput
      FILE_SERVER_URL: ${PUBLIC_TOOL_URL:-http://localhost:3000/tool}/v1/file_tool
      FILE_SERVER_INTERNAL_URL: http://cute-tool:1601/v1/file_tool
      SQLITE_DB_PATH: /data/autobots.db
      SQLITE_PATH: /data/mrag_sqlite.db
      LOG_PATH: /data/logs/cute-tool.log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - cute-data:/data
    depends_on:
      cute-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:1601/docs', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12

  cute-backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    env_file:
      - ./cute-tool/.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai-agent-station}
      MYSQL_USER: ${MYSQL_USER:-cute}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      CUTE_TOOL_BASE_URL: http://cute-tool:1601
      WORKSPACE_ROOT: /data/skilloutput
      SKILL_DIR: /app/runtime/skills
      CUTE_OPENCLI_COMMAND: node
      CUTE_OPENCLI_MAIN: /opt/opencli/dist/src/main.js
      # backend 与 cute-tool 共享 cute-data 卷（/data/skilloutput），
      # 文件产物走零拷贝 register；若改成不共享目录的部署，改成 upload。
      CUTE_FILE_ARTIFACT_LOCAL_FILE_MODE: ${CUTE_FILE_ARTIFACT_LOCAL_FILE_MODE:-register}
      ADAPTER_HOST_SECRET: ${ADAPTER_HOST_SECRET:?ADAPTER_HOST_SECRET is required}
      KERNEL_API_KEY: ${KERNEL_API_KEY:-}
    volumes:
      - cute-data:/data
      - cute-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      cute-tool:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        SERVICE_BASE_URL: ${SERVICE_BASE_URL:-}
        CUTE_TOOL_BASE_URL: ${CUTE_TOOL_BASE_URL:-/tool}
        VITE_Mrag_TOOL_URL: ${VITE_Mrag_TOOL_URL:-/tool}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - cute-backend
      - cute-tool

volumes:
  mysql-data:
  cute-data:
