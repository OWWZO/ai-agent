openapi: 3.1.0
info:
  title: Reactor Tool MRAG Query API
  version: 0.1.0
  description: >
    为 Java `multimodalagent_tool` 提供多模态知识检索能力的 SSE 接口。
    响应流兼容 OpenAI chat completion 增量片段，结束标记为 `[DONE]`。
servers:
  - url: http://127.0.0.1:1601
paths:
  /v1/tool/mragQuery:
    post:
      summary: Execute multimodal RAG retrieval
      operationId: postMragQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultimodalRAGRequest'
            examples:
              default:
                summary: 文本问题检索默认知识库
                value:
                  question: 总结知识库中关于多模态检索的核心能力
                  image_urls: []
                  kb_id: default-kb
      responses:
        '200':
          description: SSE stream with OpenAI-compatible delta chunks and final `[DONE]`
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                openaiCompatible:
                  summary: 增量输出示例
                  value: |-
                    data: {"id":"chatcmpl-mrag-001","choices":[{"delta":{"content":"多模态检索会先召回图文片段。"},"finishReason":null,"index":0}],"created":1760000000,"model":"mrag-agent","object":"chat.completion.chunk"}
                    data: {"id":"chatcmpl-mrag-001","choices":[{"delta":{"content":"最终结果支持 Markdown 图片引用。"},"finishReason":"stop","index":0}],"created":1760000001,"model":"mrag-agent","object":"chat.completion.chunk"}
                    data: [DONE]
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '502':
          description: Upstream MRAG dependency failed before stream establishment
        '504':
          description: Upstream MRAG dependency timed out before stream establishment
components:
  schemas:
    MultimodalRAGRequest:
      type: object
      additionalProperties: false
      required:
        - question
      properties:
        question:
          type: string
          minLength: 1
          description: 文本检索问题，本期用户侧唯一必填输入
        image_urls:
          type: array
          description: 预留给 MRAG 内部图像上下文的图片 URL 列表，本期默认空数组
          items:
            type: string
          default: []
        kb_id:
          type:
            - string
            - 'null'
          description: 指定知识库 ID；为空时回退服务端默认知识库
    ValidationErrorResponse:
      type: object
      properties:
        detail:
          type: array
          items:
            type: object
            additionalProperties: true
